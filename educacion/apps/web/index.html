<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>ÑANDÉ Educación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/estilos.css" />
    <style>
      .hero { padding: 36px 0 24px; }
      .hero h1 { font-size: 34px; line-height: 1.1; margin: 12px 0 10px; }
      .hero h1 span { color: var(--verde); }
      .lista { display: grid; gap: 12px; margin-top: 8px; }
      .lista a { text-decoration: none; color: inherit; display: block; }
      .lista h2 { font-size: 18px; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <main class="contenedor">
      <section class="hero">
        <span class="etiqueta">En construcción</span>
        <h1>ÑANDÉ <span>Educación</span></h1>
        <p class="secundario">Tutor con inteligencia artificial para escuelas públicas de Santa Cruz. Gratis.</p>
      </section>
      <div class="lista">
        <a class="tarjeta" href="/prueba-motor/">
          <h2>Hablar con Kay 🎙️</h2>
          <p class="secundario chico">Prueba técnica del tutor de voz (necesita cuenta de prueba).</p>
        </a>
        <a class="tarjeta" href="/maqueta/">
          <h2>Maqueta de la plataforma</h2>
          <p class="secundario chico">Tutor · Alumno 3D · Padres · Dirección (datos de demo).</p>
        </a>
      </div>
    </main>
  </body>
</html>
