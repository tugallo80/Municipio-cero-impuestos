<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7cc8f5">
<title>Alumno · Mundo del curso (maqueta v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --verde: #10B981; --verde-osc: #047857; --panel: #0F1A17; --borde: #1F3B33; --texto2: #A3A3A3; --oro: #FDE047; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #7cc8f5; font-family: 'Inter', system-ui, sans-serif; color: #fff; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none; }
  h1, h2, h3, .t { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  #mundo { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  /* HUD */
  .hud { position: fixed; top: 0; left: 0; right: 0; padding: calc(10px + env(safe-area-inset-top)) 12px 0; display: flex; gap: 8px; align-items: center; z-index: 10; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .boton-hud { width: 46px; height: 46px; border-radius: 14px; background: rgba(15,26,23,.85); border: 2px solid rgba(255,255,255,.15); display: grid; place-items: center; font-size: 20px; color: #fff; text-decoration: none; box-shadow: 0 4px 0 rgba(0,0,0,.25); flex-shrink: 0; }
  .jugador { flex: 1; display: flex; align-items: center; gap: 10px; background: rgba(15,26,23,.85); border: 2px solid rgba(255,255,255,.15); border-radius: 16px; padding: 6px 10px 6px 6px; box-shadow: 0 4px 0 rgba(0,0,0,.25); min-width: 0; }
  .jugador .cara { width: 34px; height: 34px; border-radius: 10px; background: var(--verde); display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }
  .jugador b { font-family: 'Space Grotesk'; font-size: 14px; display: block; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jugador small { font-size: 11px; color: #cbd5e1; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jugador > div:nth-child(2) { min-width: 0; flex: 1; }
  .llaves { font-family: 'Space Grotesk'; font-weight: 700; color: var(--oro); white-space: nowrap; font-size: 15px; }
  .kay { background: var(--verde); border-color: #6EE7B7; }
  .chip-puente { position: fixed; top: calc(66px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 8px; background: rgba(15,26,23,.85); border: 2px solid rgba(255,255,255,.15); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .chip-puente .mini { width: 70px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; }
  .chip-puente .mini i { display: block; height: 100%; background: var(--oro); border-radius: 99px; transition: width .6s; }
  .ayuda { position: fixed; top: calc(108px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: rgba(15,26,23,.8); border-radius: 99px; padding: 8px 14px; font-size: 13px; z-index: 10; white-space: nowrap; pointer-events: none; transition: opacity .4s; }
  .aviso-ayuda { position: fixed; left: 12px; right: 12px; top: calc(108px + env(safe-area-inset-top)); z-index: 12; display: none; align-items: center; gap: 10px; background: #FEF3C7; color: #422006; border-radius: 16px; padding: 10px 12px; box-shadow: 0 5px 0 #CA8A04; font-size: 14px; max-width: 460px; margin: 0 auto; animation: sube .3s ease; }
  .aviso-ayuda.ver { display: flex; }
  .aviso-ayuda b { font-family: 'Space Grotesk'; }
  .aviso-ayuda .bj { min-height: 40px; padding: 0 12px; font-size: 14px; }

  /* Joystick y botones de acción */
  .joy { position: fixed; left: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); width: 116px; height: 116px; border-radius: 50%; background: rgba(15,26,23,.35); border: 3px solid rgba(255,255,255,.35); z-index: 10; touch-action: none; }
  .joy i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .acciones { position: fixed; right: 12px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 10; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .acciones .fila-acc { display: flex; gap: 8px; }
  .redondo { width: 54px; height: 54px; border-radius: 18px; background: rgba(15,26,23,.88); border: 2px solid rgba(255,255,255,.18); display: grid; place-items: center; font-size: 24px; box-shadow: 0 4px 0 rgba(0,0,0,.3); position: relative; }
  .redondo small { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .redondo.ayudar { background: #F59E0B; border-color: #FDE68A; }
  .entrar { display: none; margin-bottom: 8px; }

  /* Botones de juego */
  .bj { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 20px; border-radius: 16px; background: var(--verde); color: #04261B; font-family: 'Space Grotesk'; font-weight: 700; font-size: 17px; box-shadow: 0 5px 0 var(--verde-osc); transition: transform .08s, box-shadow .08s; }
  .bj:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--verde-osc); }
  .bj.gris { background: #E2E8F0; color: #0F172A; box-shadow: 0 5px 0 #94A3B8; }
  .bj.oro { background: var(--oro); color: #422006; box-shadow: 0 5px 0 #CA8A04; }
  .bj.ancho { width: 100%; }
  .bj[disabled] { opacity: .45; }

  /* Paneles */
  .panel-velo { position: fixed; inset: 0; z-index: 50; background: rgba(4,12,10,.55); display: none; align-items: flex-end; justify-content: center; }
  .panel-velo.abierto { display: flex; }
  .panel { width: 100%; max-width: 520px; max-height: 88vh; overflow: auto; background: var(--panel); border: 3px solid var(--borde); border-bottom: 0; border-radius: 26px 26px 0 0; padding: 18px 16px calc(22px + env(safe-area-inset-bottom)); animation: sube .25s ease; touch-action: pan-y; }
  @media (min-width: 700px) { .panel-velo { align-items: center; } .panel { border-radius: 26px; border-bottom: 3px solid var(--borde); } }
  @keyframes sube { from { transform: translateY(40px); opacity: 0; } }
  .panel .cab { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .panel .cab .icono { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; flex-shrink: 0; }
  .panel .cab h2 { font-size: 20px; line-height: 1.15; }
  .panel .cab small { color: var(--texto2); font-size: 13px; }
  .cerrar { margin-left: auto; width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.08); font-size: 18px; flex-shrink: 0; }
  .barra { height: 12px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 99px; transition: width .6s; }
  .tit { margin: 18px 0 4px; font-size: 13px; color: var(--texto2); font-family: 'Inter'; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .mision { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border-radius: 18px; background: rgba(255,255,255,.05); border: 2px solid rgba(255,255,255,.08); margin-top: 10px; }
  .mision b { font-family: 'Space Grotesk'; font-size: 16px; display: block; }
  .mision small { color: var(--texto2); font-size: 12px; display: block; }
  .mision .derecha { margin-left: auto; font-size: 22px; flex-shrink: 0; }
  .mision.hecha { opacity: .6; }
  .etq { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: rgba(16,185,129,.18); color: #6EE7B7; }
  .etq.oro { background: rgba(253,224,71,.15); color: var(--oro); }
  .pasos { display: flex; gap: 6px; margin: 12px 0; }
  .pasos i { flex: 1; height: 10px; border-radius: 99px; background: rgba(255,255,255,.12); }
  .pasos i.ok { background: var(--verde); }
  .pasos i.rep { background: #7DD3FC; }
  .pregunta { font-family: 'Space Grotesk'; font-size: 20px; margin: 6px 0 14px; line-height: 1.25; }
  .opciones { display: grid; gap: 10px; }
  .opcion { min-height: 56px; border-radius: 16px; background: #E2E8F0; color: #0F172A; font-weight: 700; font-size: 17px; box-shadow: 0 5px 0 #94A3B8; padding: 8px 12px; }
  .opcion.mal { background: #FCA5A5; box-shadow: 0 5px 0 #DC2626; animation: tiembla .3s; }
  .opcion.bien { background: #6EE7B7; box-shadow: 0 5px 0 var(--verde-osc); }
  @keyframes tiembla { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .feedback { margin-top: 12px; padding: 12px; border-radius: 14px; background: rgba(252,165,165,.12); border: 2px solid rgba(252,165,165,.35); font-size: 15px; line-height: 1.4; display: none; }
  .feedback.ver { display: block; animation: sube .2s ease; }
  .escalera { margin-top: 16px; padding: 12px; border-radius: 16px; background: rgba(16,185,129,.08); border: 2px solid rgba(16,185,129,.3); }
  .escalera .peldano { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.4; margin-top: 10px; animation: sube .25s ease; }
  .escalera .peldano span:first-child { font-size: 20px; }
  .escalones { display: flex; gap: 4px; margin-left: auto; }
  .escalones i { width: 18px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); }
  .escalones i.ok { background: var(--verde); }

  .premio { text-align: center; padding: 6px 0; }
  .premio .grande { font-size: 76px; display: inline-block; animation: gira 1.2s ease; }
  @keyframes gira { from { transform: scale(.2) rotate(-180deg); } 70% { transform: scale(1.2) rotate(10deg); } }
  .premio h2 { font-size: 25px; color: var(--oro); margin: 6px 0; }
  .caja-info { padding: 12px; border-radius: 16px; background: rgba(255,255,255,.05); border: 2px solid rgba(255,255,255,.08); font-size: 14px; line-height: 1.45; }
  .niebla { position: relative; height: 130px; border-radius: 18px; overflow: hidden; background: linear-gradient(#312e81, #1e1b4b); margin-bottom: 12px; display: grid; place-items: center; font-size: 56px; }
  .niebla .sil { filter: brightness(0) opacity(.55); }
  .niebla::after { content: ''; position: absolute; inset: -20%; background: radial-gradient(circle at 30% 40%, rgba(233,213,255,.75), transparent 45%), radial-gradient(circle at 70% 60%, rgba(233,213,255,.7), transparent 45%); animation: neblina 4s ease-in-out infinite alternate; }
  @keyframes neblina { to { transform: translateX(8%) scale(1.1); } }
  .niebla .candado { position: absolute; right: 12px; top: 10px; font-size: 26px; z-index: 2; }

  /* Pizza y minijuegos */
  .pizza { display: block; margin: 8px auto 6px; width: 230px; height: 230px; }
  .pizza path { cursor: pointer; transition: transform .15s, opacity .15s; transform-origin: 115px 115px; }
  .pizza path.servida { transform: scale(1.08); filter: brightness(1.15); stroke: #10B981; stroke-width: 5; }
  .objetos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .objeto { aspect-ratio: 1; border-radius: 18px; background: #E2E8F0; font-size: 44px; box-shadow: 0 5px 0 #94A3B8; }
  .objeto.mal { background: #FCA5A5; animation: tiembla .3s; } .objeto.bien { background: #6EE7B7; }
  .palabras { display: flex; flex-wrap: wrap; gap: 8px; }
  .palabra { padding: 10px 14px; border-radius: 99px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.15); font-weight: 700; }
  .palabra.si { background: rgba(16,185,129,.25); border-color: var(--verde); }
  .palabra.no { background: rgba(252,165,165,.2); border-color: #FCA5A5; }
  mark { background: rgba(253,224,71,.3); color: #fff; padding: 0 4px; border-radius: 6px; }

  /* Casa */
  .casa { position: relative; height: 170px; border-radius: 18px; background: linear-gradient(#7dd3fc, #bae6fd 60%, #86efac 60%); overflow: hidden; margin-bottom: 12px; }
  .casa .muro { position: absolute; left: 50%; bottom: 26px; width: 150px; height: 82px; transform: translateX(-50%); border-radius: 6px; }
  .casa .techo { position: absolute; left: 50%; bottom: 104px; width: 0; height: 0; transform: translateX(-50%); border-left: 92px solid transparent; border-right: 92px solid transparent; border-bottom: 48px solid; }
  .casa .puerta { position: absolute; left: 50%; bottom: 26px; width: 30px; height: 46px; transform: translateX(-50%); background: #7c4a1e; border-radius: 4px 4px 0 0; }
  .casa .adornos { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; justify-content: space-between; padding: 0 14px; font-size: 30px; }
  .reacciones { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .reaccion { min-height: 56px; border-radius: 16px; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.12); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; }
  .reaccion span { font-size: 24px; }
  .frases { display: flex; flex-wrap: wrap; gap: 8px; }
  .frase { padding: 12px 14px; border-radius: 99px; background: #E2E8F0; color: #0F172A; font-weight: 700; box-shadow: 0 4px 0 #94A3B8; }
  .emotes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 10px; }
  .emote { aspect-ratio: 1; border-radius: 14px; background: rgba(255,255,255,.08); font-size: 26px; }

  /* Chat tutor IA */
  .chat { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 14px; }
  .burbuja { max-width: 88%; padding: 12px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; animation: sube .25s ease; }
  .burbuja.ia { background: rgba(16,185,129,.16); border: 2px solid rgba(16,185,129,.35); border-bottom-left-radius: 6px; align-self: flex-start; }
  .burbuja.yo { background: #E2E8F0; color: #0F172A; border-bottom-right-radius: 6px; align-self: flex-end; font-weight: 600; }
  .sugerencias { display: flex; gap: 8px; flex-wrap: wrap; }
  .sug { padding: 10px 14px; border-radius: 99px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.15); font-size: 14px; font-weight: 600; }

  .cargando { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: linear-gradient(#7cc8f5, #bfe6fb); color: #0F172A; text-align: center; padding: 24px; }
  .cargando .t { font-size: 22px; margin-bottom: 6px; }
  .lista2d { display: none; position: fixed; inset: 110px 12px 160px; overflow: auto; z-index: 5; }
  .lista2d.ver { display: grid; gap: 10px; align-content: start; }
  .toast { position: fixed; left: 50%; top: calc(110px + env(safe-area-inset-top)); transform: translateX(-50%); background: var(--oro); color: #422006; padding: 12px 18px; border-radius: 16px; font-family: 'Space Grotesk'; font-weight: 700; z-index: 200; box-shadow: 0 5px 0 #CA8A04; max-width: 92vw; text-align: center; animation: sube .25s ease; }
</style>
</head>
<body>
<canvas id="mundo"></canvas>

<div class="hud">
  <a class="boton-hud" href="index.html" title="Salir">←</a>
  <div class="jugador">
    <div class="cara" id="cara"></div>
    <div><b id="apodo"></b><small>4to A · isla del curso</small></div>
    <span class="llaves" id="llaves" title="Tus llaves"></span>
  </div>
  <button class="boton-hud kay" id="btn-kay" title="Kay, tu tutor">💬</button>
</div>
<button class="chip-puente" id="chip-puente" onclick="abrirPuente()">🌉 <span id="puente-txt"></span><span class="mini"><i id="puente-mini"></i></span></button>
<div class="ayuda" id="ayuda">Mové el círculo para caminar · tocá un aula</div>
<div class="aviso-ayuda" id="aviso-ayuda"></div>
<div class="joy" id="joy"><i></i></div>
<div class="acciones">
  <button class="bj entrar" id="entrar"></button>
  <div class="fila-acc">
    <button class="redondo" onclick="abrirFrases()" title="Frases">😄<small>Frases</small></button>
    <button class="redondo ayudar" onclick="abrirAyuda()" title="Pedir ayuda">🙋<small>Ayuda</small></button>
    <button class="redondo" onclick="abrirMochila()" title="Mochila">🎒<small>Mochila</small></button>
  </div>
</div>
<div class="lista2d" id="lista2d"></div>

<div class="cargando" id="cargando"><div><div class="t">Armando la isla del curso…</div><div>bloque por bloque 🧱</div></div></div>

<div class="panel-velo" id="velo"><div class="panel" id="panel"></div></div>

<script src="datos-demo.js"></script>
<script>
// ============================================================
// Maqueta del alumno v2 (EDU.01b). Todo simulado, sin backend.
// Principios: misión → llave → lugar; sin ranking, sin puntos, sin rachas, sin premios al azar;
// comunicación solo con frases/emotes de lista; cierre natural tras 2 misiones.
// ============================================================
const D = DEMO, YO = D.alumnoDemo, M = D.mundo;
const $ = s => document.querySelector(s);
const materia = id => D.materias.find(m => m.id === id);
const lugar = id => M.lugares.find(l => l.id === id);
const LIMITE_HOY = 2;            // cierre natural
const S = {                      // estado de la sesión
  llaves: new Set(),             // lugares con llave
  abiertos: new Set(),           // lugares ya abiertos
  mentor: 0,                     // llaves de mentor
  hoy: 0,                        // misiones de hoy
  adornos: [...M.miCasa.adornos],
  visitados: {},                 // reacción dejada por casa
  marca: { mision: 'fracciones', antes: 9, ahora: null }
};
window.S = S;
$('#cara').textContent = YO.avatar;
$('#apodo').textContent = YO.apodo;
function pintarHud() {
  $('#llaves').textContent = '🗝️ ' + (S.llaves.size + S.mentor);
  const p = M.puente;
  $('#puente-txt').textContent = `${p.hechas}/${p.meta} entre todos`;
  $('#puente-mini').style.width = Math.min(100, p.hechas / p.meta * 100) + '%';
}
pintarHud();
function toast(t, ms = 2300) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }

// ---------------- Sonidos cortos (sin archivos) ----------------
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = false; } } return ac; }
function tono(f, t0, d, tipo = 'sine', vol = .07, f2) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = tipo; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05);
}
window.sonar = tipo => {
  if (tipo === 'pajaros') [0, .18, .5, .62].forEach((t, i) => tono(2300 + i * 200, t, .12, 'sine', .05, 3400));
  if (tipo === 'clic') [0, .12, .5, .62].forEach(t => tono(1400, t, .03, 'square', .04));
  if (tipo === 'llave') [523, 659, 784, 1046].forEach((f, i) => tono(f, i * .09, .25, 'triangle', .07));
  if (tipo === 'abrir') [392, 523, 659, 784, 1046, 1318].forEach((f, i) => tono(f, i * .07, .35, 'triangle', .06));
  if (tipo === 'bien') [659, 880].forEach((f, i) => tono(f, i * .08, .15, 'sine', .06));
  if (tipo === 'casi') tono(330, 0, .18, 'sine', .05, 260);
  if (tipo === 'pop') tono(600, 0, .08, 'sine', .05, 900);
};
addEventListener('pointerdown', () => audio(), { once: true });

// ---------------- Paneles ----------------
const velo = $('#velo'), panel = $('#panel');
function abrir(html) { panel.innerHTML = html; velo.classList.add('abierto'); panel.scrollTop = 0; window.__pausa = true; }
function cerrar() { velo.classList.remove('abierto'); window.__pausa = false; }
velo.addEventListener('click', e => { if (e.target === velo) cerrar(); });
const cab = (icono, fondo, titulo, sub, volver = 'cerrar()', etq = '') => `
  <div class="cab"><div class="icono" style="background:${fondo}">${icono}</div>
    <div style="min-width:0">${etq}<h2 ${etq ? 'style="margin-top:4px"' : ''}>${titulo}</h2>${sub ? `<small>${sub}</small>` : ''}</div>
    <button class="cerrar" onclick="${volver}">${volver === 'cerrar()' ? '✕' : '←'}</button></div>`;

// ============================================================
// Contenido de las misiones: repaso + pasos con escalera de Kay
// escalera = [pregunta que guía, pista, ejemplo resuelto]; mal = feedback concreto por opción
// ============================================================
const CONT = {
  M1: {
    repaso: [
      { de: 'hace 3 días', q: '¿Cuánto es 6 × 4?', ops: ['24', '20', '28'], ok: 0, mal: { 1: '20 es 5 × 4. Te falta sumar un 4 más.', 2: '28 es 7 × 4. Te pasaste por un 4.' } },
      { de: 'hace 7 días', q: 'En 3/5, ¿cuál es el denominador?', ops: ['3', '5', '8'], ok: 1, mal: { 0: '3 es el numerador: las partes que tomás. El denominador es el de abajo.', 2: '8 sería sumar los dos. El denominador es el número de abajo.' } }
    ],
    pasos: [

const RONDAS_PIZZA = [
  { n: 4, a: 3, b: 4, texto: 'Serví <b>3/4</b> de la pizza a tus amigos' },
  { n: 8, a: 1, b: 2, texto: 'Ahora la pizza tiene 8 pedazos. Serví <b>1/2</b>' },

];
let PZ = { r: 0, sel: new Set() };
function pizza(r) {
  PZ = { r, sel: new Set() };
  const R = RONDAS_PIZZA[r], c = 115, rad = 104;
  const tajadas = Array.from({ length: R.n }, (_, i) => {
    const a0 = i * 2 * Math.PI / R.n - Math.PI / 2, a1 = a0 + 2 * Math.PI / R.n;
    const p0 = [c + rad * Math.cos(a0), c + rad * Math.sin(a0)], p1 = [c + rad * Math.cos(a1), c + rad * Math.sin(a1)];
    return `<path d="M${c} ${c} L${p0} A${rad} ${rad} 0 0 1 ${p1} Z" fill="${i % 2 ? '#F59E0B' : '#FBBF24'}" stroke="#78350F" stroke-width="3" onclick="tajada(this, ${i})"/>`;
  }).join('');
  abrir(cab('🍕', 'rgba(34,197,94,.2)', 'Picnic de fracciones', 'Parque escondido · ronda ' + (r + 1) + ' de 3', `abrirLugar('parque')`) + `
    <p style="text-align:center;font-size:17px">${R.texto}</p>
    <svg class="pizza" viewBox="0 0 230 230"><circle cx="115" cy="115" r="110" fill="#92400E"/>${tajadas}
      ${[[80, 80], [150, 75], [70, 150], [145, 150], [115, 112]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="8" fill="#DC2626" pointer-events="none"/>`).join('')}</svg>
    <p style="text-align:center;font-family:'Space Grotesk';font-size:22px" id="pz-cuenta">Serviste 0/${R.n}</p>
    <div class="feedback" id="feedback"></div>
    <button class="bj ancho" style="margin-top:12px" onclick="revisarPizza()">✔ Listo</button>`);
}
function tajada(el, i) {
  el.classList.toggle('servida'); PZ.sel.has(i) ? PZ.sel.delete(i) : PZ.sel.add(i); window.sonar('pop');
  $('#pz-cuenta').textContent = `Serviste ${PZ.sel.size}/${RONDAS_PIZZA[PZ.r].n}`;
}
function revisarPizza() {
  const R = RONDAS_PIZZA[PZ.r], k = PZ.sel.size, fb = $('#feedback');
  if (k * R.b === R.a * R.n) {
    window.sonar('bien');
    const eq = R.n !== R.b ? `<br>¡${k}/${R.n} es lo mismo que ${R.a}/${R.b}! Son fracciones equivalentes.` : '';
    fb.style.background = 'rgba(16,185,129,.15)'; fb.style.borderColor = 'rgba(16,185,129,.5)';
    fb.innerHTML = `🎉 ¡Justo! Serviste ${k}/${R.n}.${eq}`; fb.classList.add('ver');
    setTimeout(() => PZ.r < RONDAS_PIZZA.length - 1 ? pizza(PZ.r + 1) : finMinijuego('🍕', '¡Picnic listo!', 'Repartiste la pizza en partes iguales. Podés volver a jugar cuando quieras.', 'parque'), 1700);
  } else {
    window.sonar('casi');
    const quiere = R.a * R.n / R.b;
    fb.innerHTML = `🧩 Serviste ${k}/${R.n}. Para ${R.a}/${R.b} con ${R.n} pedazos ${k < quiere ? 'te falta' : 'te sobra'}${Math.abs(quiere - k) === 1 ? ' 1 pedazo' : 'n ' + Math.abs(quiere - k) + ' pedazos'}.`
      + (R.n !== R.b ? ` Pista: la mitad de ${R.n} es ${R.n / 2}.` : '');
    fb.classList.add('ver');
  }
}

  if (o !== R.ok) { btn.classList.add('mal'); window.sonar('casi'); setTimeout(() => btn.classList.remove('mal'), 400);
    const fb = $('#feedback'); fb.innerHTML = '🧩 Ese no. Volvé a leer cómo es: ' + R.adj.map(a => `<mark>${a}</mark>`).join(', '); fb.classList.add('ver'); return; }
  btn.classList.add('bien'); window.sonar('bien');
  // segundo paso: marcar las palabras que describen (adjetivos)
  const palabras = R.desc.filter(w => w !== ',').flatMap(w => w.split(' ')).filter(w => w.length > 1);
  setTimeout(() => {
    const objs = panel.querySelector('.objetos'); if (!objs) return;
    objs.outerHTML = `<p style="margin:4px 0 10px;font-weight:600">¡Lo encontraste! Tocá las palabras que dicen <b>cómo es</b>:</p>
      <div class="palabras">${palabras.map(w => `<button class="palabra" onclick="marcarPalabra(this, ${R.adj.includes(w)}, ${r})">${w}</button>`).join('')}</div>`;

function marcarPalabra(el, esAdj, r) {
  const R = RONDAS_PERDIDOS[r];

    fb.innerHTML = '🎉 ¡Eso! Las palabras que dicen cómo es algo se llaman <b>adjetivos</b>.'; fb.classList.add('ver');

<script type="module">
// ------------------------------------------------------------
// Isla del curso en 3D, estilo bloques (diseño propio). three.js con versión exacta;
// si no carga, se usa la lista 2D. Pensado para celular de gama media: sin sombras,
// materiales simples, suelo instanciado, pixel ratio limitado.
// ------------------------------------------------------------
const FUENTES = [
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js'
];
let THREE = null;
for (const url of FUENTES) { try { THREE = await import(url); break; } catch (e) { /* probar la siguiente */ } }
if (!THREE) { window.__modo2D('Sin conexión para el 3D: elegí un lugar'); }
else iniciar(THREE);

function iniciar(THREE) {
  const D = window.DEMO, YO = D.alumnoDemo, M = D.mundo;
  const canvas = document.getElementById('mundo');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(innerWidth, innerHeight);

  const escena = new THREE.Scene();
  escena.background = new THREE.Color('#7cc8f5');
  escena.fog = new THREE.Fog('#a9dcf8', 34, 70);
  const camara = new THREE.PerspectiveCamera(innerHeight > innerWidth ? 58 : 50, innerWidth / innerHeight, 0.1, 200);
  escena.add(new THREE.HemisphereLight('#ffffff', '#5b7a3a', 1.6));
  const sol = new THREE.DirectionalLight('#fff4d6', 1.6); sol.position.set(12, 20, 8); escena.add(sol);

  const caja = new THREE.BoxGeometry(1, 1, 1);
  const mats = {};
  const mat = c => mats[c] || (mats[c] = new THREE.MeshLambertMaterial({ color: c }));
  function bloque(x, y, z, sx, sy, sz, color, padre = escena) {
    const m = new THREE.Mesh(caja, typeof color === 'string' ? mat(color) : color);
    m.position.set(x, y, z); m.scale.set(sx, sy, sz); padre.add(m); return m;
  }
  function etiqueta(texto, color = '#10B981', ancho = 360) {
    const c = document.createElement('canvas'); c.width = ancho; c.height = 96;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(15,26,23,.9)'; g.beginPath(); g.roundRect(4, 4, ancho - 8, 88, 30); g.fill();
    g.lineWidth = 6; g.strokeStyle = color; g.stroke();
    g.fillStyle = '#fff'; g.font = '700 40px "Space Grotesk", Inter, "Noto Color Emoji", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(texto, ancho / 2, 50, ancho - 30);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false }));
    s.scale.set(ancho / 96 * .75, .75, 1); s.renderOrder = 6; return s;
  }
  const solidos = [];   // cajas de choque
  const tocables = [];  // mallas tocables con userData.toca = { tipo, id }
  const interes = [];   // puntos con botón contextual { pos, texto, accion }
  function hacerTocable(g, toca) { g.traverse(o => { if (o.isMesh || o.isSprite) { o.userData.toca = toca; tocables.push(o); } }); }

  // --- Suelo (una malla instanciada) con arroyo al fondo ---
  const X0 = -22, X1 = 22, Z0 = -25, Z1 = 20;
  const enArroyo = z => z >= -19.5 && z <= -16.5;
  const esCamino = (x, z) => (Math.abs(x) <= 1.5 && z <= 10 && z >= -16) || (Math.abs(z) <= 1.5 && Math.abs(x) <= 10) || Math.hypot(x, z) < 4.2 || (Math.abs(z - 13.5) <= 1 && Math.abs(x) <= 14);
  const celdas = [];
  for (let x = X0; x <= X1; x++) for (let z = Z0; z <= Z1; z++) celdas.push([x, z]);
  const suelo = new THREE.InstancedMesh(caja, new THREE.MeshLambertMaterial(), celdas.length);
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  celdas.forEach(([x, z], k) => {
    const agua = enArroyo(z), camino = esCamino(x, z), otra = z < -19.5;
    m4.makeTranslation(x, agua ? -.85 : camino ? -.45 : -.5 + ((x * 7 + z * 13) % 5 === 0 ? .08 : 0), z);
    suelo.setMatrixAt(k, m4);
    col.set(agua ? ((x + z) % 2 ? '#38bdf8' : '#0ea5e9') : otra ? ((x + z) % 2 ? '#8b9a7a' : '#7f8f6f') : camino ? ((x + z) % 2 ? '#e7d8b1' : '#ddcb9c') : ((x * 3 + z) % 4 === 0 ? '#5fae4f' : (x + z) % 2 ? '#6bbd57' : '#64b552'));
    suelo.setColorAt(k, col);
  });
  escena.add(suelo);

  // --- Plaza central ---
  bloque(0, 1.8, 0, .25, 4, .25, '#e5e7eb');
  const bandera = bloque(.85, 3.3, 0, 1.4, .8, .08, '#10B981');

    comp.forEach(P => {
      if (P.espera > 0) { P.espera -= dt; animar(P, false, dt, t); return; }
      const [tx, tz] = P.ruta[(P.k + 1) % P.ruta.length];
      const dx = tx - P.yo.position.x, dz = tz - P.yo.position.z, d = Math.hypot(dx, dz);
      if (d < .2) { P.k = (P.k + 1) % P.ruta.length; P.espera = 1 + Math.random() * 2; return; }
      P.yo.position.x += dx / d * 2.2 * dt; P.yo.position.z += dz / d * 2.2 * dt; P.yo.rotation.y = Math.atan2(dx, dz);
      animar(P, true, dt, t);
    });

    // punto de interés cercano → botón contextual (y sonido de los lugares con niebla)
    cercano = null; let mejor = 2.8;
    for (const p of interes) { const d = p.pos.distanceTo(yo.position); if (d < mejor) { mejor = d; cercano = p; } }
    btnEntrar.style.display = cercano && !window.__pausa ? 'inline-flex' : 'none';
    if (cercano) btnEntrar.textContent = cercano.texto;
    if (cercano && cercano.lugar && ultimoSonido !== cercano.lugar && !window.S.abiertos.has(cercano.lugar)) { window.sonar(cercano.lugar === 'parque' ? 'pajaros' : 'clic'); }
    ultimoSonido = cercano ? cercano.lugar : null;

    aulas.forEach((a, i) => {
      a.sp.position.y = 6.3 + Math.sin(t * 1.5 + i) * .12;
      if (a.aviso) { a.aviso.rotation.y += dt * 2; a.aviso.position.y = 7.6 + Math.sin(t * 3 + i) * .2; }
    });
    // niebla que respira
    matNiebla.opacity = .45 + Math.sin(t * 1.3) * .12;
    Object.values(lugares3D).forEach(L => {
      const lista = Array.isArray(L) ? L : L.nubecitas;
      lista.forEach(n => { n.position.y = n.userData.base.y + Math.sin(t * .9 + n.userData.fase) * .25; n.position.x = n.userData.base.x + Math.sin(t * .5 + n.userData.fase) * .2; });
      if (!Array.isArray(L) && L.abriendo) {
        L.abriendo = Math.min(1, L.abriendo + dt * .8);
        L.cerrado.scale.setScalar(1 - L.abriendo * .99); L.cerrado.position.y = L.abriendo * 3;
        L.abierto.scale.setScalar(Math.min(1, L.abriendo * 1.2));
        L.puertaHoja.rotation.y = (L.l.id === 'parque' ? .5 + L.abriendo * 1.1 : -.7 - L.abriendo * .8);
        if (L.abriendo >= 1) { L.cerrado.visible = false; L.abriendo = 0; }
      }
    });
    const ahora = performance.now();
    for (let i = burbujas.length - 1; i >= 0; i--) if (burbujas[i].hasta < ahora) { burbujas[i].P.yo.remove(burbujas[i].b); burbujas[i].b.material.map.dispose(); burbujas.splice(i, 1); }
    bandera.scale.y = .8 + Math.sin(t * 3) * .05;

    objetivoCam.copy(yo.position).add(offset);
    camara.position.lerp(objetivoCam, Math.min(1, dt * 4));
    camara.lookAt(yo.position.x, yo.position.y + 1, yo.position.z - 2);
    renderer.render(escena, camara);
    requestAnimationFrame(bucle);
  }
  camara.position.copy(yo.position).add(offset);
  bucle();
  document.getElementById('cargando').style.display = 'none';
  window.__listo3D = true;
}
</script>
