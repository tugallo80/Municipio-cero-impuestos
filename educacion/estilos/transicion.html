<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pasaste de curso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --verde: #10B981; --sup: rgba(10,10,10,.84); --borde: #262626; --t2: #A3A3A3; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #fff; font-family: Inter, system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .barra { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); align-items: center; }
  .btn { min-height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--borde); background: var(--sup); color: #fff;
    font: 600 15px Inter, sans-serif; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; cursor: pointer; }
  .btn.on, .btn.verde { background: var(--verde); color: #00140D; border-color: var(--verde); }
  #fps { margin-left: auto; font: 700 13px ui-monospace, monospace; padding: 0 12px; min-height: 36px; border-radius: 12px; background: var(--sup); border: 1px solid var(--borde); display: flex; align-items: center; }
  #fps.bien { color: #34D399; } #fps.medio { color: #F2C230; } #fps.mal { color: #F87171; }
  #mensaje { position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(560px, calc(100vw - 32px));
    background: rgba(0,0,0,.82); border: 1px solid #1f3b31; border-radius: 22px; padding: 16px 18px 18px; text-align: center; transition: opacity .4s, transform .4s; }
  #mensaje h1 { font-family: 'Space Grotesk', Inter, sans-serif; font-size: clamp(24px, 6.4vw, 34px); line-height: 1.1; }
  #mensaje p { color: #D4D4D4; margin-top: 6px; font-size: 15px; }
  #mensaje .botones { display: none; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  #mensaje.fin .botones { display: flex; }
  .chispa { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: caer 2.2s ease-out forwards; }
  @keyframes caer { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(540deg); opacity: 0; } }
  body.captura .barra { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="barra">
  <a class="btn" href="./" aria-label="Volver">←</a>
  <a class="btn" id="b12" href="?de=BLOQUES&a=PIEZAS">1 → 2</a>
  <a class="btn" id="b23" href="?de=PIEZAS&a=REAL">2 → 3</a>
  <div id="fps">— fps</div>
</div>
<div id="mensaje"><h1 id="titulo">¡Terminaste el curso!</h1><p id="texto">Preparando tu mundo…</p>
  <div class="botones"><button class="btn" id="bOtra">Ver de nuevo</button><a class="btn verde" id="bEntrar" href="#">Entrar a mi mundo nuevo</a></div></div>

<script type="module">
import { crearMundo, TRAMOS } from './mundo.js';

const q = new URLSearchParams(location.search);
const DE = (q.get('de') || 'BLOQUES').toUpperCase(), A = (q.get('a') || 'PIEZAS').toUpperCase();
const captura = q.has('captura'), tFijo = q.has('t') ? parseFloat(q.get('t')) : null;
if (captura) document.body.classList.add('captura');
document.getElementById(DE === 'PIEZAS' ? 'b23' : 'b12').classList.add('on');
const CURSO = { PIEZAS: '4.º de primaria', REAL: '1.º de secundaria' };

const FUENTES = [
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js'
];
let THREE = null;
for (const url of FUENTES) { try { THREE = await import(url); break; } catch (e) { /* siguiente */ } }
if (!THREE) { document.getElementById('texto').textContent = 'No se pudo cargar three.js. Probá con conexión.'; window.__listo = 'sin-three'; throw new Error('sin three'); }

const viejo = crearMundo(THREE, DE), nuevo = crearMundo(THREE, A);
for (const m of [viejo, nuevo]) m.etiquetas.visible = false;
const cieloViejo = viejo.escena.background.clone(), cieloNuevo = nuevo.escena.background.clone();
viejo.escena.background = null; nuevo.escena.background = null;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: captura });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.autoClear = false;
const camara = new THREE.PerspectiveCamera(45, 1, 0.3, 400);
function ajustar() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, q.get('calidad') === 'alta' ? 2 : 1.5));
  renderer.setSize(innerWidth, innerHeight, false);
  camara.aspect = innerWidth / innerHeight; camara.fov = innerHeight > innerWidth ? 55 : 42; camara.updateProjectionMatrix();
}
addEventListener('resize', ajustar); ajustar();

// la "ola" de luz esmeralda que transforma el mundo
const capaLuz = new THREE.Scene();
const gc = document.createElement('canvas'); gc.width = 128; gc.height = 4;
const gx = gc.getContext('2d'), gr = gx.createLinearGradient(0, 0, 128, 0);
gr.addColorStop(0, 'rgba(16,185,129,0)'); gr.addColorStop(0.42, 'rgba(125,227,190,.55)'); gr.addColorStop(0.5, 'rgba(255,255,255,.95)'); gr.addColorStop(0.58, 'rgba(125,227,190,.55)'); gr.addColorStop(1, 'rgba(16,185,129,0)');
gx.fillStyle = gr; gx.fillRect(0, 0, 128, 4);
const tLuz = new THREE.CanvasTexture(gc); tLuz.colorSpace = THREE.SRGBColorSpace;
const ola = new THREE.Mesh(new THREE.PlaneGeometry(9, 40), new THREE.MeshBasicMaterial({ map: tLuz, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
ola.rotation.y = Math.PI / 2; ola.position.y = 12;
const ola2 = ola.clone(); ola2.rotation.set(0, 0, 0); ola2.scale.set(1, 1, 1);
const grupoOla = new THREE.Group(); grupoOla.add(ola);
// la ola es un plano vertical perpendicular a x, de 90 de largo: se arma con varios paneles
for (let k = -40; k <= 40; k += 9) { const p = ola.clone(); p.position.z = k; grupoOla.add(p); }
ola.visible = false;
capaLuz.add(grupoOla);

const planoViejo = new THREE.Plane(new THREE.Vector3(1, 0, 0), 0);   // deja x > s
const planoNuevo = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);  // deja x < s

const DUR = { espera: 1.3, ola: 3.2 };
let t0 = performance.now();
const objetivo = new THREE.Vector3(0.5, 1.2, 1.5);
const titulo = document.getElementById('titulo'), texto = document.getElementById('texto'), msj = document.getElementById('mensaje');
let fase = -1;
function ponerFase(f) {
  if (f === fase) return; fase = f;
  if (f === 0) { titulo.textContent = '¡Terminaste el curso!'; texto.textContent = 'Lo que aprendiste este año cambia tu mundo…'; msj.classList.remove('fin'); }
  if (f === 1) { titulo.textContent = 'Tu mundo se transforma'; texto.textContent = `De "${TRAMOS[DE].nombre}" a "${TRAMOS[A].nombre}"`; }
  if (f === 2) {
    titulo.textContent = `¡Pasaste a ${CURSO[A]}!`;
    texto.textContent = `Tu mundo ahora es "${TRAMOS[A].nombre}". Tu colegio, tus obras y tus amigos siguen acá.`;
    msj.classList.add('fin');
    if (!captura) chispas();
  }
}
function chispas() {
  const colores = ['#10B981', '#7DE3BE', '#F2C230', '#E68AB8', '#5FB7C9'];
  for (let i = 0; i < 46; i++) {
    const d = document.createElement('div'); d.className = 'chispa';
    d.style.left = (40 + Math.random() * 20) + 'vw'; d.style.top = '60vh'; d.style.background = colores[i % colores.length];
    d.style.setProperty('--dx', (Math.random() - 0.5) * 90 + 'vw'); d.style.setProperty('--dy', -(20 + Math.random() * 50) + 'vh');
    document.body.appendChild(d); setTimeout(() => d.remove(), 2400);
  }
}
document.getElementById('bOtra').onclick = () => { t0 = performance.now(); ponerFase(0); };
document.getElementById('bEntrar').href = `escena.html?estilo=${A}&vista=colegio`;

const fpsEl = document.getElementById('fps');
let cuadros = 0, tF = performance.now(); window.__fps = [];
const cielo = new THREE.Color();
function cuadro() {
  const ahora = performance.now();
  const t = tFijo != null ? tFijo : (ahora - t0) / 1000;
  const k = Math.min(1, Math.max(0, (t - DUR.espera) / DUR.ola));
  const suave = k * k * (3 - 2 * k);
  const s = -48 + 96 * suave;          // la ola cruza el mapa de oeste a este
  ponerFase(t < DUR.espera ? 0 : k < 1 ? 1 : 2);
  // cámara: vista del colegio que gira despacio
  const ang = 0.62 + t * 0.05, radio = innerHeight > innerWidth ? 46 : 30;
  camara.position.set(objetivo.x + Math.sin(ang) * radio, objetivo.y + radio * 0.62, objetivo.z + Math.cos(ang) * radio);
  camara.lookAt(objetivo);
  viejo.ajustarNiebla(radio); nuevo.ajustarNiebla(radio);
  viejo.animar(t); nuevo.animar(t);
  cielo.copy(cieloViejo).lerp(cieloNuevo, suave);
  renderer.setClearColor(cielo); renderer.clear();
  planoViejo.constant = -s; planoNuevo.constant = s;
  if (k > 0) { renderer.clippingPlanes = [planoNuevo]; renderer.render(nuevo.escena, camara); }
  if (k < 1) { renderer.clippingPlanes = [planoViejo]; renderer.render(viejo.escena, camara); }
  renderer.clippingPlanes = [];
  if (k > 0 && k < 1) { grupoOla.position.x = s; ola.visible = false; renderer.render(capaLuz, camara); }
  cuadros++;
  if (ahora - tF >= 1000) {
    const f = Math.round(cuadros * 1000 / (ahora - tF)); window.__fps.push(f);
    fpsEl.textContent = `${f} fps`; fpsEl.className = f >= 30 ? 'bien' : f >= 20 ? 'medio' : 'mal';
    cuadros = 0; tF = ahora;
  }
  requestAnimationFrame(cuadro);
}
cuadro();
requestAnimationFrame(() => requestAnimationFrame(() => { window.__listo = 'ok'; }));
</script>
</body>
</html>
