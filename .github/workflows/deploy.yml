name: Deploy a producción

# Cada push a main publica el sitio en Firebase Hosting (municipio-ia.web.app).
# Entra a Google Cloud por Workload Identity: no hay llaves guardadas.
# Functions llegan con EDU.01 (se agregará un paso cuando exista educacion/services o functions/).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

env:
  PROYECTO: municipio-ia

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Armar el sitio
        run: bash scripts/build-site.sh

      - name: Entrar a Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/359679900643/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deploy@municipio-ia.iam.gserviceaccount.com

      - name: Publicar en Firebase Hosting
        run: npx --yes firebase-tools@13 deploy --only hosting --project "$PROYECTO" --non-interactive --message "main ${GITHUB_SHA::7}"
